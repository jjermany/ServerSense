[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serversense"
version = "1.0.0"
description = "ServerSense monitoring and intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "docker>=7.1,<8",
  "psutil>=7,<8",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "coverage>=7.10,<8",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-docker>=7.1,<8",
  "types-psutil>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/serversense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Using .*starlette.testclient.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
